name: Backend CI
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt httpx
      - run: cd backend && python -m unittest discover -p 'test_*.py'
