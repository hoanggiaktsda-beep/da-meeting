name: Foundation CI
on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
